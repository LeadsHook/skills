<section class="bg-white dark:bg-gray-900">
  <div class="max-w-screen-xl mx-auto px-4 py-8 lg:px-6 lg:py-16 text-center">
    <figure class="max-w-2xl mx-auto">
      <svg class="h-10 mx-auto mb-6 text-gray-400 dark:text-gray-600" fill="currentColor" viewBox="0 0 24 27">
        <path
          d="M14.017 18L14.017 10.609C14.017 4.905 17.748 1.039 23 0L23.995 2.151C21.563 3.068 20 5.789 20 8H24V18H14.017ZM0 18V10.609C0 4.905 3.748 1.038 9 0L9.996 2.151C7.563 3.068 6 5.789 6 8H9.983L9.983 18L0 18Z"
        />
      </svg>
      <blockquote>
        <p
          class="text-2xl font-medium text-gray-900 dark:text-white"
          contenteditable="true"
        >
          {{QUOTE}}
        </p>
      </blockquote>
      <figcaption class="flex items-center justify-center mt-6 space-x-3">
        <img class="w-10 h-10 rounded-full" src="{{AVATAR_URL}}" alt="{{AUTHOR_NAME}}" />
        <div class="flex items-center divide-x-2 divide-gray-300 dark:divide-gray-600">
          <div
            class="pr-3 font-medium text-gray-900 dark:text-white"
            contenteditable="true"
          >
            {{AUTHOR_NAME}}
          </div>
          <div class="pl-3 text-sm text-gray-500 dark:text-gray-400" contenteditable="true">
            {{AUTHOR_TITLE}}
          </div>
        </div>
      </figcaption>
    </figure>
  </div>
</section>
