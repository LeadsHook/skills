<section class="bg-white dark:bg-gray-900">
  <div class="grid lg:grid-cols-12 max-w-screen-xl mx-auto px-4 py-8 lg:gap-8 lg:py-16">
    <div class="lg:col-span-7 mr-auto place-self-center">
      <h1
        class="max-w-2xl mb-4 text-4xl font-extrabold leading-none tracking-tight text-gray-900 md:text-5xl xl:text-6xl dark:text-white"
        contenteditable="true"
      >
        {{HEADLINE}}
      </h1>
      <p
        class="max-w-2xl mb-6 lg:mb-8 font-light text-gray-500 md:text-lg lg:text-xl dark:text-gray-400"
        contenteditable="true"
      >
        {{SUBTEXT}}
      </p>
      <div data-editor-buttons-block class="flex flex-col sm:flex-row gap-3">
        <a
          href="#"
          class="inline-flex items-center justify-center px-6 py-3 rounded-lg text-base font-medium text-white bg-brand-600 hover:bg-brand-700 focus:ring-4 focus:ring-brand-300 dark:focus:ring-brand-900"
          contenteditable="true"
          >{{CTA_PRIMARY}}</a
        >
        <a
          href="#"
          class="inline-flex items-center justify-center px-6 py-3 border border-gray-300 rounded-lg text-base font-medium text-gray-900 bg-white hover:bg-gray-100 dark:border-gray-600 dark:text-white dark:bg-gray-800 dark:hover:bg-gray-700"
          contenteditable="true"
          >{{CTA_SECONDARY}}</a
        >
      </div>
    </div>
    <div class="hidden lg:col-span-5 lg:mt-0 lg:flex">
      <img
        src="{{HERO_IMAGE_URL}}"
        alt="{{HERO_IMAGE_ALT}}"
        class="w-full rounded-xl object-cover"
      />
    </div>
  </div>
</section>
